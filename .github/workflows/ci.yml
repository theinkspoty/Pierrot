name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build + testes (Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev

      - name: Configurar CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build -j"$(nproc)"

      - name: Testes (ctest)
        run: ctest --test-dir build --output-on-failure

  # É o job que procura de fato os SIGSEGV em decode concorrente: o código
  # segura mutex à mão em volta dos decoders, e o AddressSanitizer é o que pega
  # um buffer liberado/duplicado que o locking deixou passar. Também serve de
  # rede de segurança para a thread do CrashReporter.
  #
  # Um teste que morre de propósito (tst_crashreporter forka um filho com
  # SIGSEGV) faria o ASAN reclamar do sinal, então esse alvo fica de fora.
  sanitizers:
    name: Sanitizers (asan + ubsan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev

      - name: Configurar CMake (asan/ubsan)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Compilar
        run: cmake --build build -j"$(nproc)"

      - name: Testes (ctest, sem o teste de crash)
        # ASAN_OPTIONS=exitcode=1 faz o ASAN reprovar o build em vez de só
        # imprimir. detect_leaks fica desligado de propósito: o Qt e o FFmpeg
        # deixam caches globais vivos na saída e reportam como leak.
        env:
          ASAN_OPTIONS: exitcode=1:detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure -E tst_crashreporter
